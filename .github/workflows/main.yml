name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      # Setup steps (Node.js, npm install, etc.) would go here...

      - name: Set up Environment Variables
        # Expose the necessary secrets as environment variables for the current step
        env:
          JIRA_INSTANCE: ${{ secrets.JIRA_INSTANCE }}
        run: |
          sed -i 's#__JIRA_INSTANCE_PLACEHOLDER__#${{ secrets.JIRA_INSTANCE }}#g' src/environments/environment.prod.ts

      - name: Build Angular App
        run: npx ng build --base-href / --configuration production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/jira-blocker-chain-angular/browser
          publish_branch: gh-pages
