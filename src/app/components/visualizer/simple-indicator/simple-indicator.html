<div class="indicator">
  @if (reverse()) {
    <div class="label">{{ normalizedLabel() }}</div>
    <div [class]="'icon ' + iconShape()" [style.background]="color()"></div>
  } @else {
    <div [class]="'icon ' + iconShape()" [style.background]="color()"></div>
    <div class="label">{{ normalizedLabel() }}</div>
  }
</div>
