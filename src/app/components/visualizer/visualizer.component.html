<div class="container">
  <div class="controls">
    <h1>Jira Blocker Chain Visualizer</h1>
    <app-form [disableSubmit]="isLoading()" (formSubmit)="fetchAndVisualize($event)"></app-form>
  </div>

  @if (isLoading()) {
    <div class="loading">
      <div class="spinner"></div>
      <div>Fetching tickets from Jira...</div>
    </div>
  }

  @if (hasData()) {
    <div class="stats">
      <div class="stats-grid">
        <app-simple-stat [label]="'Total Tickets'" [value]="stats().total"></app-simple-stat>
        <app-simple-stat [label]="'Blocking Tickets'" [value]="stats().blocking"></app-simple-stat>
        <app-simple-stat [label]="'Blocked Tickets'" [value]="stats().blocked"></app-simple-stat>
        <app-simple-stat [label]="'Independent Tickets'" [value]="stats().independent"></app-simple-stat>
      </div>
    </div>

    <div class="graph-container">
      <svg #graphSvg id="graph"></svg>

      <div class="actions">
        <button (click)="downloadSvg()">Download as SVG</button>
        <button (click)="downloadPng()">Download as PNG</button>
      </div>
    </div>

    <div class="legend">
      <h3>Legend</h3>
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-circle" [style.background]="colors.Green"></div>
          <span>Done</span>
        </div>
        <div class="legend-item">
          <div class="legend-circle" [style.background]="colors.Peach"></div>
          <span>In Progress</span>
        </div>
        <div class="legend-item">
          <div class="legend-circle" [style.background]="colors.Blue"></div>
          <span>To Do</span>
        </div>
        <div class="legend-item">
          <div class="legend-circle" [style.background]="colors.Gray"></div>
          <span>Other Status</span>
        </div>
      </div>
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-shape circle"></div>
          <span>Team Armadillo</span>
        </div>
        <div class="legend-item">
          <div class="legend-shape hexagon"></div>
          <span>Team Backpack</span>
        </div>
        <div class="legend-item">
          <div class="legend-shape square"></div>
          <span>Team AI</span>
        </div>
        <div class="legend-item">
          <div class="legend-shape triangle"></div>
          <span>No Team</span>
        </div>
      </div>
    </div>
  }
</div>
