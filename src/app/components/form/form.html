<div class="controls-group">
    <div class="form-group">
        <label for="project-name">Project Name</label>
        <input
        type="text"
        id="project-name"
        [(ngModel)]="projectName"
        placeholder="packback">
        <div class="help-text">Your Jira project name (&lt;project&gt;.atlassian.net)</div>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input
        type="email"
        id="email"
        [(ngModel)]="email"
        placeholder="your.email@example.com">
        <div class="help-text">Your Jira account email address</div>
</div>
</div>

<div class="form-group">
    <label for="api-token">API Token</label>
    <input
    type="password"
    id="api-token"
    [(ngModel)]="apiToken"
    placeholder="Your Jira API token">
    <div class="help-text">Generate a token at: Jira Settings > Personal Access Tokens</div>
</div>

<div class="form-group">
    <label for="team">Team</label>
    <select id="team" [(ngModel)]="team">
    <option value="">Select a team...</option>
    <option value="Armadillo">Armadillo</option>
    <option value="Backpack">Backpack</option>
    <option value="AI">AI</option>
    </select>
</div>

<div class="form-group">
    <label for="sprints">Sprint Numbers</label>
    <input
    type="text"
    id="sprints"
    [(ngModel)]="sprints"
    placeholder="e.g., 45 or 45,46,47">
    <div class="help-text">Enter one or more sprint numbers separated by commas</div>
</div>

<button (click)="validateAndSubmit()" [disabled]="disableSubmit">
    Fetch & Visualize
</button>

@if (errorMessage()) {
    <div class="error">{{ errorMessage() }}</div>
}
